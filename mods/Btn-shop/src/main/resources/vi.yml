# Cach hoat dong (uu tien tu tren xuong):
#   1. tim-ten     : khop chinh xac material -> dung luon ten do
#   2. from-tien-to: tinh tu phia truoc (vd: 'GILDED Sword' -> 'Cuong vang Kiem')
