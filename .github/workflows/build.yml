name: Build Minecraft plugins

on:
  push:
    branches: ["kilo/turbo-chip-udo"]
    paths:
      - "mods/**"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Download Vault API dependency
        run: mkdir -p build-lib && curl --fail --location --silent --show-error --output build-lib/VaultAPI.jar https://jitpack.io/com/github/MilkBowl/VaultAPI/1.7/VaultAPI-1.7.jar
      - name: Build all plugins
        run: bash ./build.sh
      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: Btn-mods-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30